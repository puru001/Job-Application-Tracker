<div class="container">
    <h1 class="mt-3">Job Application List</h1>
    <div class="d-flex justify-content-end mb-3">
        <a [routerLink]="['/jobapplications/add']" class="btn btn-primary">Add Job Application</a>
    </div>
   
    <ng-container *ngIf="jobapplications$ | async as jobapplications">
        <table class="table table-bordered">
          <thead>
            <tr>
              <th>Company Name</th>
              <th>Position</th>
              <th>Status</th>
              <th>Date Applied</th>
              <th>Actions(Edit)</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let application of jobapplications">
              <td>{{ application.companyName }}</td>
              <td>{{ application.position }}</td>
              <td>{{ application.status }}</td>
              <td>{{ application.dateApplied | date }}</td>
              <!-- <td>
                <button class="btn btn-primary btn-sm" (click)="edit(job)">Edit</button>
              </td> -->
              <td>
                <a class="btn btn-light" [routerLink]="['/jobapplications', application.id]">Edit</a>                
              </td>
            </tr>
          </tbody>
        </table>
      
      <!-- <nav aria-label="Page navigation example">
        <ul class="pagination">
          <li class="page-item"><a class="page-link" (click)="getPrevPage()">Previous</a></li>
      
          <li *ngFor="let item of list;let index = index" class="page-item" >
            <a class="page-link" (click)="getPage(index + 1)">{{index + 1}}</a>
          </li>
      
      
          <li class="page-item"><a class="page-link" (click)="getNextPage()">Next</a></li>
        </ul>
      </nav> -->
       </ng-container>
</div>
