<div class="container">

    <h1 class="mt-3">Add Job Application</h1>
  
    <form #form="ngForm" (ngSubmit)="onJobAdd()">
      <div class="mt-2">
  
        <div class="mt-3">
          <label class="form-label">Company Name</label>
          <input [(ngModel)]="model.companyName" name="companyName" class="form-control" required />
        </div>
        
        <div class="mt-3">
          <label class="form-label">Position</label>
          <input [(ngModel)]="model.position" name="position" class="form-control" required />
        </div>
        
        <div class="mt-3">
          <label class="form-label">Status</label>
          <select [(ngModel)]="model.status" name="status" class="form-control">
            <option>Applied</option>
            <option>Interview</option>
            <option>Offer</option>
            <option>Rejected</option>
          </select>
        </div>
  
  
        <div class="mt-3">
          <label class="form-label">Date Applied</label>
          <input [(ngModel)]="model.dateApplied" name="dateApplied" type="date" class="form-control" required />
        </div>
  
        <div class="mt-3">
          <!-- <button type="submit" class="btn btn-success">{{ model.id ? 'Update' : 'Add' }}</button> -->
          <button type="submit" class="btn btn-success">Test</button>
        </div>
  
      </div>
  
  
    </form>
