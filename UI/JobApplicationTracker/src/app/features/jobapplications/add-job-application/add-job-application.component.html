<div class="container">

    <h1 class="mt-3">Add Job Application</h1>
  
    <form #form="ngForm" (ngSubmit)="onJobAdd()">
      <div class="mt-2">
  
        <div class="mt-3">
          <label class="form-label">Company Name</label>
          <input [(ngModel)]="model.companyName" name="companyName" class="form-control" required #companyName="ngModel"/>
          <div *ngIf="companyName.invalid && companyName.touched" class="text-danger">
            Company Name is required.
          </div>
        </div>
        
        <div class="mt-3">
          <label class="form-label">Position</label>
          <input [(ngModel)]="model.position" name="position" class="form-control" required minlength="2" #position="ngModel" />
          <div *ngIf="position.invalid && position.touched" class="text-danger">
            <div *ngIf="position.errors?.['required']">Position is required.</div>
            <div *ngIf="position.errors?.['minlength']">Position must be at least 2 characters long.</div>
          </div>
        </div>
        
        <div class="mt-3">
          <label class="form-label">Status</label>
          <select [(ngModel)]="model.status" name="status" class="form-control" required #status="ngModel">
            <option value="" disabled selected>Select status</option>
            <option>Applied</option>
            <option>Interview</option>
            <option>Offer</option>
            <option>Rejected</option>
          </select>
          <div *ngIf="status.invalid && status.touched" class="text-danger">
            Status is required.
          </div>
        </div>
  
  
        <div class="mt-3">
          <label class="form-label">Date Applied</label>
          <input [(ngModel)]="model.dateApplied" name="dateApplied" type="date" class="form-control" [max]="today" required #dateApplied="ngModel" />
          <div *ngIf="dateApplied.invalid && dateApplied.touched" class="text-danger">
            A valid application date is required.
          </div>
        </div>
  
        <div class="mt-3">
          <!-- <button type="submit" class="btn btn-success">{{ model.id ? 'Update' : 'Add' }}</button> -->
          <button type="submit" class="btn btn-success">Add</button>
        </div>
  
      </div>
  
  
    </form>
