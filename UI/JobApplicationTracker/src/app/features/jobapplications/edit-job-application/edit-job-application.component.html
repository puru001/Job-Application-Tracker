<div class="container">
    <h1 class="mt-3">Edit Job Application</h1>
    <!-- <ng-container *ngIf="jobApplication$ | async as jobApplication; else notFound"> -->
        <ng-container *ngIf="jobApplication; else notFound">
        <form #form="ngForm" (ngSubmit)="onJobApplicationEdit()">
            <div class="mt-2">
        
              <div class="mt-3">
                <label class="form-label">Company Name</label>
                <input [(ngModel)]="jobApplication.companyName" name="companyName" class="form-control" required />
              </div>
              
              <div class="mt-3">
                <label class="form-label">Position</label>
                <input [(ngModel)]="jobApplication.position" name="position" class="form-control" required />
              </div>
              
              <div class="mt-3">
                <label class="form-label">Status</label>
                <select [(ngModel)]="jobApplication.status" name="status" class="form-control">
                  <option>Applied</option>
                  <option>Interview</option>
                  <option>Offer</option>
                  <option>Rejected</option>
                </select>
              </div>
        
        
              <div class="mt-3">
                <label class="form-label">Date Applied</label>
                <input [(ngModel)]="jobApplication.dateApplied" name="dateApplied" class="form-control" required disabled />
              </div>
        
              <div class="mt-3">
                <button [id]="jobApplication.id" type="submit" class="btn btn-success">Update</button>                
              </div>        
            </div>
        
        
          </form>
    </ng-container>
    <ng-template #notFound>
        <div class="alert alert-warning" role="alert">
            Job application not found!
          </div>
    </ng-template>
</div>
